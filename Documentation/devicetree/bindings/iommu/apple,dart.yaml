%YAML 1.2
---
$id: http://devicetree.org/schemas/iommu/apple,dart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple DART IOMMU

maintainers:
  - Sven Peter <sven@svenpeter.dev>

description: |+
  Apple SoCs may contain an implementation of their Device Address
  Resolution Table which provides a mandatory layer of address
  translations for various masters.

  Each DART instance is capable of handling up to 16 different streams
  with individual pagetables and page-level read/write protection flags.

  This DART IOMMU also raises interrupts in response to various
  fault conditions.

properties:
  compatible:
    oneOf:
      - enum:
          - apple,t8103-dart
          - apple,t8103-usb4-dart
          - apple,t8110-dart
          - apple,t6000-dart
      - items:
          - enum:
              - apple,t6020-dart
              - apple,t8122-dart
              - apple,t8132-dart
          - const: apple,t8110-dart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    description:
      Reference to the gate clock phandle if required for this IOMMU.
      Optional since not all IOMMUs are attached to a clock gate.

  apple,dma-range:
    $ref: /schemas/types.yaml#/definitions/uint64-array
    minItems: 2
    maxItems: 2
    description:
      Base and size of the usable device address aperture. Firmware may reserve
      the remaining address space or configure bypass windows there.

  '#iommu-cells':
    const: 1
    description:
      Has to be one. The single cell describes the stream id emitted by
      a master to the IOMMU.

  apple,sid-remap:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    description: |
      Hardware requestor SID aliases required by this DART's integration.
      Each pair contains a source requestor SID followed by the target
      translation SID whose page tables and access controls it must use.
      Only T8110-compatible DARTs support this mapping; target SIDs are
      limited to the four-bit TCR remap field.

      Aliased requestors cannot be isolated from their target and must share
      its translation context and IOMMU group. A source SID must not also
      appear as a target; self-maps, chains and cycles are not supported.
      SIDs not listed as sources retain identity mapping. Omit this property
      when no hardware requestor aliases are required.
    minItems: 1
    maxItems: 255
    items:
      items:
        - description: Source requestor SID
          maximum: 255
        - description: Target translation SID
          maximum: 15

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - '#iommu-cells'
  - interrupts

allOf:
  - if:
      not:
        properties:
          compatible:
            contains:
              const: apple,t8110-dart
    then:
      properties:
        apple,sid-remap: false

additionalProperties: false

examples:
  - |+
    dart1: iommu@82f80000 {
      compatible = "apple,t8103-dart";
      reg = <0x82f80000 0x4000>;
      interrupts = <1 781 4>;
      #iommu-cells = <1>;
    };

    master1 {
      iommus = <&dart1 0>;
    };

  - |+
    dart2a: iommu@82f00000 {
      compatible = "apple,t8103-dart";
      reg = <0x82f00000 0x4000>;
      interrupts = <1 781 4>;
      #iommu-cells = <1>;
    };
    dart2b: iommu@82f80000 {
      compatible = "apple,t8103-dart";
      reg = <0x82f80000 0x4000>;
      interrupts = <1 781 4>;
      #iommu-cells = <1>;
    };

    master2 {
      iommus = <&dart2a 0>, <&dart2b 1>;
    };
