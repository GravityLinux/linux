%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,t8132-dp-altmode.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8132 direct DisplayPort output routing

maintainers:
  - Niklas Sheth <hi@niklassheth.com>

description: |
  A direct DisplayPort output of an ATC can be connected to an eligible
  display coprocessor. The main engine can participate while its fixed output
  is disconnected. The source crossbar and DPTX firmware target must be
  changed together. The ATC PHY itself owns negotiated lane assignment and
  plug orientation. USB4 DP-IN adapters and tunneled displays are separate.

properties:
  compatible:
    const: apple,t8132-dp-altmode

  apple,atc-index:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 3
    description: DFP endpoint index in the ADT display crossbar.

  apple,display-engines:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    minItems: 1
    maxItems: 3
    items:
      maxItems: 1
    description: Display engines eligible for this output, in allocation order. A fixed
      output engine is eligible only while its own connector is disconnected.

  mode-switch: true

  phys:
    maxItems: 1

  phy-names:
    const: dp-phy

  mux-controls:
    maxItems: 1

  mux-control-names:
    const: dp-xbar

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: HPD notification link to the USB-C connector.

required:
  - compatible
  - apple,atc-index
  - apple,display-engines
  - mode-switch
  - phys
  - phy-names
  - mux-controls
  - mux-control-names
  - port

additionalProperties: false
