# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/net/apple,centauri-pci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Centauri PCI Wi-Fi and Bluetooth firmware handoff

maintainers:
  - Cody Ho <codyho@stanford.edu>

description: |
  Centauri is a multifunction PCIe endpoint. Function 0 (106b:1901) provides
  shared control, function 1 (106b:1902) provides Wi-Fi, and function 2
  (106b:1903) provides Bluetooth. Function identification and BAR assignment
  use standard PCI enumeration; no board model or serial number is required.

  This initial binding describes the firmware-initialized polling transport.
  The bootloader owns PCIe clocks, PHY, reset, MSI setup, firmware startup,
  and DART translations. The host can be described with the standard generic
  ECAM binding once initialized. Do not enable the native DART driver for the
  retained domains: reinitializing them would destroy live firmware mappings.

  Each function references immutable host-generated current-boot queue metadata
  in reserved memory. This is neither executable firmware nor captured packet
  replay. The reserved memory must have a fixed reg provided by the loader,
  must contain the matching CENH0001 (Wi-Fi) or CENB0002 (Bluetooth) header,
  and must remain normal RAM (no no-map property). The metadata contains its
  own byte length and nonce. The DMA allocations it references must also be
  reserved. The driver checks addresses against PCI and DT resources.

# Native cold functions use a chip compatible followed by the PCI identity.
# Select only the legacy single-compatible handoff nodes for this schema.
select:
  properties:
    compatible:
      contains:
        enum:
          - pci106b,1902
          - pci106b,1903
      maxItems: 1
  required:
    - compatible

properties:
  compatible:
    enum:
      - pci106b,1902
      - pci106b,1903

  reg:
    maxItems: 1

  memory-region:
    maxItems: 1
    description: Reserved immutable current-boot queue handoff metadata.

  apple,firmware-dart:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: |
      Reference to the firmware-owned DART hardware node, kept disabled to
      prevent Linux from taking over its live domains. The transport reads
      only error status at offset 0x100 of its first reg resource. This is
      not an IOMMU attachment and must not be combined with Linux ownership
      of these same translation domains. Native DMA/IOMMU ownership is future
      work; SID allocation is not inferred from this phandle.

  local-mac-address:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 6
    maxItems: 6
    description: |
      Factory address copied by the loader from the ADT. The associated Wi-Fi
      station may currently use a randomized address in its queue handoff.

required:
  - compatible
  - reg
  - apple,firmware-dart

additionalProperties: false

allOf:
  - if:
      properties:
        status:
          const: disabled
      required:
        - status
    then: {}
    else:
      required:
        - memory-region
