%YAML 1.2
---
$id: http://devicetree.org/schemas/net/bluetooth/apple,centauri.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T2026 Centauri Bluetooth PCI function

maintainers:
  - Cody Ho <codyho@stanford.edu>

description: |
  The Bluetooth function shares firmware with the Centauri control function.
  It consumes a resource from the current control firmware boot and generates
  its own context and HCI rings in normal coherent DMA memory. The supplier
  remains bound while Bluetooth is in use. No reserved-memory handoff is used.
  This binding is experimental pending complete power and reprobe integration.

allOf:
  - $ref: /schemas/pci/pci-device.yaml

select:
  properties:
    compatible:
      contains:
        const: apple,t2026-centauri-bluetooth
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t2026-centauri-bluetooth
      - const: pci106b,1903

  reg:
    maxItems: 1

  apple,control:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Shared Centauri control function on the same PCI device.

  local-bd-address:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 6
    maxItems: 6
    description: Factory Bluetooth address in little-endian HCI byte order.

required:
  - compatible
  - reg
  - apple,control
  - local-bd-address

unevaluatedProperties: false
