%YAML 1.2
---
$id: http://devicetree.org/schemas/net/apple,centauri-radio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T2026 Centauri radio PCI function

maintainers:
  - Cody Ho <codyho@stanford.edu>

description: |
  The Wi-Fi function consumes a resource produced by the shared control
  function's current firmware boot. It owns its coherent DMA resources and
  context through the ordinary PCI/IOMMU interfaces, without a reserved-memory
  queue handoff. The control supplier must remain bound during radio use.
  This experimental binding describes cold initialization, not a live context
  supplied by an earlier driver.

allOf:
  - $ref: /schemas/pci/pci-device.yaml

select:
  properties:
    compatible:
      contains:
        const: apple,t2026-centauri-wifi
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t2026-centauri-wifi
      - const: pci106b,1902

  reg:
    maxItems: 1

  apple,control:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Shared Centauri control function on the same PCI device.

  local-mac-address:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 6
    maxItems: 6
    description: Factory address supplied by platform firmware for this device.

required:
  - compatible
  - reg
  - apple,control

unevaluatedProperties: false
